<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&family=Inter:wght@400&display=swap" rel="stylesheet" />

    <title>Bio - Kevin Ilhamsyah</title>

    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #111827;
        overflow: hidden;
      }
      h1,
      h2,
      .font-lexend {
        font-family: 'Lexend', sans-serif;
      }

      /* Animasi masuk elemen */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes popIn {
        0% {
          transform: scale(0.5);
          opacity: 0;
        }
        80% {
          transform: scale(1.05);
          opacity: 1;
        }
        100% {
          transform: scale(1);
        }
      }

      .animate-pop-in {
        animation: popIn 0.6s ease-out forwards;
      }
      .animate-fade-in-1 {
        animation: fadeIn 0.5s 0.2s ease-out forwards;
        opacity: 0;
      }
      .animate-fade-in-2 {
        animation: fadeIn 0.5s 0.4s ease-out forwards;
        opacity: 0;
      }
      .animate-fade-in-3 {
        animation: fadeIn 0.5s 0.6s ease-out forwards;
        opacity: 0;
      }
      .animate-fade-in-4 {
        animation: fadeIn 0.5s 0.8s ease-out forwards;
        opacity: 0;
      }

      .card-glow {
        box-shadow: 0 0 15px rgba(236, 72, 153, 0.2), 0 0 30px rgba(139, 92, 246, 0.2);
      }
      .player-glow {
        box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
      }
      .btn-gradient {
        background-image: linear-gradient(to right, #ec4899, #8b5cf6);
      }

      @keyframes pulseGlow {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 0 15px rgba(139, 92, 246, 0.5);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 0 30px rgba(236, 72, 153, 0.8);
        }
      }
      .pulse-button {
        animation: pulseGlow 2s infinite ease-in-out;
      }

      @keyframes bounce {
        10%, 90% { transform: scaleY(0.3); }
        50% { transform: scaleY(1); }
      }
      .bar {
        animation: bounce 0.8s ease-in-out infinite;
        transform-origin: bottom;
      }
      .bar:nth-child(2) { animation-delay: 0.15s; }
      .bar:nth-child(3) { animation-delay: 0.3s; }
      .bar:nth-child(4) { animation-delay: 0.45s; }
    </style>
  </head>
  <body class="bg-gray-900 flex items-center justify-center min-h-screen p-3 sm:p-6 lg:p-8 pb-32 sm:pb-8">
    
    <div id="enter-screen" class="fixed inset-0 bg-gray-900 flex flex-col items-center justify-center z-[100] transition-all duration-1000 ease-in-out">
      <div class="absolute w-72 h-72 rounded-full bg-purple-600 blur-[100px] opacity-30 top-1/4 left-1/4"></div>
      <div class="absolute w-72 h-72 rounded-full bg-pink-600 blur-[100px] opacity-30 bottom-1/4 right-1/4"></div>
      
      <div class="text-center z-10 p-6 max-w-sm">
        <h2 class="text-2xl font-bold text-gray-400 mb-2 font-lexend tracking-wider">WELCOME TO</h2>
        <h1 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-500 font-lexend mb-8 tracking-tight">KEVIN'S SPACE</h1>
        <p class="text-sm text-gray-500 mb-8 font-medium">Aktifkan volume suara untuk pengalaman vibe penuh ✨</p>
        <button id="enter-btn" class="pulse-button btn-gradient text-white text-lg font-bold py-4 px-10 rounded-full transition-all duration-300 focus:outline-none">
          Click to Vibe
        </button>
      </div>
    </div>

    <audio id="bg-music" loop>
      <source src="music.mp3" type="audio/mpeg" />
      <source src="https://archive.org/download/neffex-careless/NEFFEX%20-%20Careless.mp3" type="audio/mpeg" />
    </audio>

    <div id="main-content" class="bg-gray-800 bg-opacity-80 backdrop-blur-sm w-11/12 sm:w-full md:max-w-xl rounded-3xl shadow-2xl overflow-hidden border border-gray-700 card-glow opacity-0 transform translate-y-10 transition-all duration-1000">
      <div class="h-44 bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 relative">
        <div class="absolute top-[calc(11rem-4rem)] left-1/2 -translate-x-1/2">
          <img
            src="kevin.jpg"
            alt="Foto Profil Kevin Ilhamsyah"
            class="w-32 h-32 rounded-full border-4 border-gray-800 shadow-lg animate-pop-in object-cover"
            onerror="this.onerror=null;this.src='https://drive.google.com/uc?export=view&id=1pVXiw_cFM32HH9tjMALwy-e6vuw2H8PA';"
          />
        </div>
      </div>

      <div class="pt-24 px-4 sm:px-6 pb-8 text-center">
        <h1 class="text-4xl font-bold text-white animate-fade-in-1">Kevin</h1>
        <p class="text-lg text-purple-300 mt-2 font-lexend animate-fade-in-2">Full-Time Dreamer</p>

        <p class="mt-6 text-gray-300 max-w-lg mx-auto animate-fade-in-3 px-2 text-sm sm:text-base">Lagi suka explore hal-hal baru di dunia digital. Kalo lagi ga mancing, paling scroll Facebook atau cari inspirasi. Let's connect! ✨</p>

        <div class="mt-8 animate-fade-in-4">
          <a href="mailto:warriorofadorable@gmail.com" class="btn-gradient text-white font-bold py-3 px-8 rounded-full transition-transform transform hover:scale-110 inline-block shadow-lg shadow-purple-500/50 text-sm sm:text-base"> Reach me </a>
        </div>
      </div>

      <div class="bg-gray-900 bg-opacity-50 border-t border-gray-700 px-6 py-6">
        <h2 class="text-center text-sm font-semibold text-gray-400 mb-4 font-lexend">Find me on Facebook</h2>
        <div class="flex justify-center items-center space-x-6">
          <a href="https://facebook.com/crucifykevin" target="_blank" class="text-gray-400 hover:text-white transition-all transform hover:scale-125">
            <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill-rule="evenodd"
                d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"
                clip-rule="evenodd"
              />
            </svg>
            <span class="sr-only">Facebook</span>
          </a>
        </div>
      </div>
    </div>

    <div id="music-player" class="fixed bottom-4 right-4 browser-default left-4 sm:left-auto sm:w-80 bg-gray-800 bg-opacity-90 backdrop-blur-md border border-gray-700 p-4 rounded-2xl flex items-center justify-between player-glow z-50 opacity-0 transition-opacity duration-1000">
      <div class="flex items-center space-x-3">
        <div id="music-vinyl" class="w-10 h-10 rounded-full bg-gradient-to-r from-purple-500 to-pink-500 flex items-center justify-center text-white font-bold text-xs shadow-md transition-transform duration-1000 ease-linear">
          🎵
        </div>
        <div>
          <h4 class="text-sm font-semibold text-white font-lexend truncate w-36 sm:w-44">Careless</h4>
          <p class="text-xs text-purple-300">NEFFEX</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <div id="visualizer" class="flex items-end space-x-0.5 h-6 w-8 opacity-50 hidden">
          <span class="bar w-1 h-4 bg-pink-500 rounded-full"></span>
          <span class="bar w-1 h-6 bg-purple-500 rounded-full"></span>
          <span class="bar w-1 h-3 bg-pink-500 rounded-full"></span>
          <span class="bar w-1 h-5 bg-purple-500 rounded-full"></span>
        </div>

        <button id="play-btn" class="w-10 h-10 rounded-full bg-purple-600 hover:bg-purple-700 flex items-center justify-center text-white focus:outline-none transition-transform active:scale-95">
          <svg id="play-icon" class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z" />
          </svg>
          <svg id="pause-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
          </svg>
        </button>
      </div>
    </div>

    <script>
      const audio = document.getElementById('bg-music');
      const enterScreen = document.getElementById('enter-screen');
      const enterBtn = document.getElementById('enter-btn');
      const mainContent = document.getElementById('main-content');
      const musicPlayer = document.getElementById('music-player');

      const playBtn = document.getElementById('play-btn');
      const playIcon = document.getElementById('play-icon');
      const pauseIcon = document.getElementById('pause-icon');
      const visualizer = document.getElementById('visualizer');
      const vinyl = document.getElementById('music-vinyl');

      let isPlaying = false;
      let rotationAngle = 0;
      let rotationInterval;

      function startRotation() {
        if (rotationInterval) clearInterval(rotationInterval);
        rotationInterval = setInterval(() => {
          rotationAngle += 2;
          vinyl.style.transform = `rotate(${rotationAngle}deg)`;
        }, 20);
      }

      function stopRotation() {
        clearInterval(rotationInterval);
      }

      function togglePlay() {
        if (isPlaying) {
          audio.pause();
          playIcon.classList.remove('hidden');
          pauseIcon.classList.add('hidden');
          visualizer.classList.add('hidden');
          stopRotation();
          isPlaying = false;
        } else {
          audio.play().then(() => {
            playIcon.classList.add('hidden');
            pauseIcon.classList.remove('hidden');
            visualizer.classList.remove('hidden');
            startRotation();
            isPlaying = true;
          });
        }
      }

      enterBtn.addEventListener('click', () => {
        audio.play().then(() => {
          isPlaying = true;
          playIcon.classList.add('hidden');
          pauseIcon.classList.remove('hidden');
          visualizer.classList.remove('hidden');
          startRotation();
        }).catch(err => {
          console.log("Audio play gagal:", err);
        });

        enterScreen.classList.add('opacity-0', 'pointer-events-none');
        
        setTimeout(() => {
          enterScreen.remove();
          document.body.style.overflow = 'auto';
          
          mainContent.classList.remove('opacity-0', 'translate-y-10');
          musicPlayer.classList.remove('opacity-0');
        }, 800);
      });

      playBtn.addEventListener('click', togglePlay);
    </script>
  </body>
</html>
